name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repo holds only the Dart code; generate the platform folders for CI.
      - run: flutter create . --platforms=android,ios --project-name fridge_chef
      # flutter create adds a sample test that refers to its own MyApp. Remove it.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
